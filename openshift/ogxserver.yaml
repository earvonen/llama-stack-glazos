# Requires the RHOAI-managed OGX Operator (DataScienceCluster
# spec.components.ogx.managementState: Managed). Remove legacy Llama Stack / lls.
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: llamastack
  namespace: glazos
spec:
  distribution:
    # OGX 1.1.2 on RHOAI 3.5 (see access.redhat.com/articles/rhoai-supported-configs).
    image: registry.redhat.io/rhoai/odh-ogx-core-rhel9:v3.5
  overrideConfig:
    name: llamastack-server-config
    key: config.yaml
  network:
    port: 8321
  workload:
    replicas: 1
    storage:
      size: 20Gi
      mountPath: "/.ogx"
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "8Gi"
    # AAP MCP: merged CA bundle (Secret from deploy-openshift.sh) + startup patch
    # ConfigMap (optional client streamable-http fixes + default Glazos instructions).
    overrides:
      volumes:
        - name: aap-mcp-trust
          secret:
            secretName: llamastack-aap-mcp-trust
        - name: llamastack-mcp-patch
          configMap:
            name: llamastack-mcp-patch
      volumeMounts:
        - name: aap-mcp-trust
          mountPath: /etc/ssl/certs/aap-merged-ca-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true
        - name: llamastack-mcp-patch
          mountPath: /etc/ogx/patches
          readOnly: true
      command:
        - /bin/sh
        - -c
        - |
          set -e
          export SSL_CERT_FILE=/etc/ssl/certs/aap-merged-ca-bundle.crt
          python3 /etc/ogx/patches/patch_llamastack_aap_mcp.py
          exec ogx run /etc/ogx/config.yaml
      env:
        - name: SQLITE_STORE_DIR
          value: "/.ogx/distributions/starter"
        - name: FILES_STORAGE_DIR
          value: "/.ogx/distributions/starter/files"
        - name: VLLM_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: VLLM_URL
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llamastack-credentials
              key: vllm-api-token
        - name: VLLM_TLS_VERIFY
          value: "false"
        - name: TAVILY_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: llamastack-credentials
              key: tavily-search-api-key
        - name: MCP_GITHUB_SSE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_GITHUB_SSE_URL
        - name: MCP_OPENSHIFT_SSE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_OPENSHIFT_SSE_URL
        - name: MCP_AAP_JOB_MGMT_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_JOB_MGMT_URL
        - name: MCP_AAP_INVENTORY_MGMT_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_INVENTORY_MGMT_URL
        - name: MCP_AAP_SYSTEM_MONITOR_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_SYSTEM_MONITOR_URL
        - name: MCP_AAP_USER_MGMT_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_USER_MGMT_URL
        - name: MCP_AAP_SECURITY_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_SECURITY_URL
        - name: MCP_AAP_PLATFORM_CONFIG_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_PLATFORM_CONFIG_URL
        - name: MCP_LINUX_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_LINUX_URL
        - name: MCP_SATELLITE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_SATELLITE_URL
        - name: MCP_ZABBIX_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_ZABBIX_URL
        - name: AAP_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: aap-mcp-credentials
              key: AAP_MCP_TOKEN
