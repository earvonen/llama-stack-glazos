# Requires the RHOAI-managed Llama Stack Operator (DataScienceCluster
# spec.components.llamastackoperator.managementState: Managed).
apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: llamastack
  namespace: glazos
spec:
  replicas: 1
  server:
    distribution:
      image: registry.redhat.io/rhoai/odh-llama-stack-core-rhel9:v3.4
    userConfig:
      configMapName: llamastack-server-config
    # AAP MCP: merged CA bundle (Secret from deploy-openshift.sh) + startup patch ConfigMap
    # (AAP streamable-http fixes + default Glazos Responses instructions).
    podOverrides:
      volumes:
        - name: aap-mcp-trust
          secret:
            secretName: llamastack-aap-mcp-trust
        - name: llamastack-mcp-patch
          configMap:
            name: llamastack-mcp-patch
      volumeMounts:
        - name: aap-mcp-trust
          mountPath: /etc/ssl/certs/aap-merged-ca-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true
        - name: llamastack-mcp-patch
          mountPath: /etc/llama-stack/patches
          readOnly: true
    storage:
      size: 20Gi
      mountPath: "/.llama"
    containerSpec:
      port: 8321
      # Override operator entrypoint: set SSL_CERT_FILE, apply AAP MCP patch, then start server.
      command:
        - /bin/sh
        - -c
        - |
          set -e
          export SSL_CERT_FILE=/etc/ssl/certs/aap-merged-ca-bundle.crt
          python3 /etc/llama-stack/patches/patch_llamastack_aap_mcp.py

          # Determine which CLI to use based on llama-stack version
          VERSION_CODE=$(python -c "
          import sys
          from importlib.metadata import version
          from packaging import version as pkg_version

          try:
              llama_version = version('llama_stack')
              print(f'Detected llama-stack version: {llama_version}', file=sys.stderr)

              v = pkg_version.parse(llama_version)
              base_v = pkg_version.parse(v.base_version)

              if base_v < pkg_version.parse('0.2.17'):
                  print('Using legacy module path (llama_stack.distribution.server.server)', file=sys.stderr)
                  print(0)
              elif base_v < pkg_version.parse('0.3.0'):
                  print('Using core module path (llama_stack.core.server.server)', file=sys.stderr)
                  print(1)
              else:
                  print('Using uvicorn CLI command', file=sys.stderr)
                  print(2)
          except Exception as e:
              print(f'Version detection failed, defaulting to new CLI: {e}', file=sys.stderr)
              print(2)
          ")

          PORT=${LLS_PORT:-8321}
          WORKERS=${LLS_WORKERS:-1}

          case $VERSION_CODE in
              0) python3 -m llama_stack.distribution.server.server --config /etc/llama-stack/config.yaml ;;
              1) python3 -m llama_stack.core.server.server /etc/llama-stack/config.yaml ;;
              2) exec uvicorn llama_stack.core.server.server:create_app --host 0.0.0.0 --port "$PORT" --workers "$WORKERS" --factory ;;
              *) echo "Invalid version code: $VERSION_CODE, using uvicorn CLI command"; \
                 exec uvicorn llama_stack.core.server.server:create_app --host 0.0.0.0 --port "$PORT" --workers "$WORKERS" --factory ;;
          esac
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "8Gi"
      env:
        - name: SQLITE_STORE_DIR
          value: "/.llama/distributions/starter"
        - name: FILES_STORAGE_DIR
          value: "/.llama/distributions/starter/files"
        - name: VLLM_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: VLLM_URL
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llamastack-credentials
              key: vllm-api-token
        - name: VLLM_TLS_VERIFY
          value: "false"
        - name: TAVILY_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: llamastack-credentials
              key: tavily-search-api-key
        - name: MCP_GITHUB_SSE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_GITHUB_SSE_URL
        - name: MCP_OPENSHIFT_SSE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_OPENSHIFT_SSE_URL
        - name: MCP_AAP_JOB_MGMT_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_JOB_MGMT_URL
        - name: MCP_AAP_INVENTORY_MGMT_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_INVENTORY_MGMT_URL
        - name: MCP_AAP_SYSTEM_MONITOR_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_SYSTEM_MONITOR_URL
        - name: MCP_AAP_USER_MGMT_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_USER_MGMT_URL
        - name: MCP_AAP_SECURITY_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_SECURITY_URL
        - name: MCP_AAP_PLATFORM_CONFIG_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_AAP_PLATFORM_CONFIG_URL
        - name: MCP_LINUX_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_LINUX_URL
        - name: MCP_SATELLITE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_SATELLITE_URL
        - name: MCP_ZABBIX_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_ZABBIX_URL
        - name: AAP_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: aap-mcp-credentials
              key: AAP_MCP_TOKEN
