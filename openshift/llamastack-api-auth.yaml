# In-cluster custom auth validator for OGX server.auth (type: custom).
# OGX POSTs {"api_key":"<bearer>","request":{...}} to /validate.
# Returns 200 when api_key matches Secret llamastack-api-auth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamastack-api-auth-code
  namespace: glazos
data:
  validate.py: |
    #!/usr/bin/env python3
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse

    EXPECTED = os.environ.get("LLAMA_STACK_API_TOKEN", "")

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            path = urlparse(self.path).path.rstrip("/") or "/"
            if path != "/validate":
                self.send_response(404)
                self.end_headers()
                return
            length = int(self.headers.get("Content-Length", "0"))
            try:
                body = json.loads(self.rfile.read(length) or b"{}")
            except json.JSONDecodeError:
                self.send_response(400)
                self.end_headers()
                return
            api_key = body.get("api_key") or ""
            if EXPECTED and api_key == EXPECTED:
                # OGX CustomAuthProvider AuthResponse shape (principal + attributes)
                payload = {
                    "principal": "glazos",
                    "attributes": {"roles": ["glazos"]},
                    "message": "Authentication successful",
                }
                data = json.dumps(payload).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            else:
                self.send_response(401)
                self.end_headers()

        def log_message(self, fmt, *args):
            return

    if not EXPECTED:
        raise SystemExit("LLAMA_STACK_API_TOKEN is empty")
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamastack-api-auth
  namespace: glazos
  labels:
    app: llamastack-api-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamastack-api-auth
  template:
    metadata:
      labels:
        app: llamastack-api-auth
    spec:
      containers:
        - name: auth
          image: registry.access.redhat.com/ubi9/python-312:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/validate.py
          env:
            - name: LLAMA_STACK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llamastack-api-auth
                  key: LLAMA_STACK_API_TOKEN
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: llamastack-api-auth-code
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: llamastack-api-auth
  namespace: glazos
  labels:
    app: llamastack-api-auth
spec:
  selector:
    app: llamastack-api-auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
