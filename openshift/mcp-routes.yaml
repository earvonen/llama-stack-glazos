# Edge TLS routes for in-cluster MCP Services (HTTP allowed on insecure edge).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: github-mcp
  namespace: glazos
  labels:
    app: github-mcp
    component: mcp
spec:
  to:
    kind: Service
    name: github-mcp
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
---
