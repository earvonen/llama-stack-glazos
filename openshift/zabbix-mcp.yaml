# initMAX Zabbix MCP Server — ghcr.io/initmax/zabbix-mcp-server + nginx Bearer injection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-mcp-nginx-template
  namespace: glazos
data:
  default.conf.template: |
    server {
      listen 8080;
      location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-mcp
  namespace: glazos
  labels:
    app: zabbix-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-mcp
  template:
    metadata:
      labels:
        app: zabbix-mcp
    spec:
      securityContext:
        fsGroup: 1000850000
      containers:
        - name: zabbix-mcp-server
          image: ghcr.io/initmax/zabbix-mcp-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/zabbix-mcp/config.toml"
            - "--host"
            - "127.0.0.1"
            - "--port"
            - "8082"
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zabbix-mcp-credentials
                  key: MCP_AUTH_TOKEN
          ports:
            - containerPort: 8082
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/zabbix-mcp/config.toml
              subPath: config.toml
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zabbix-mcp-credentials
                  key: MCP_AUTH_TOKEN
          volumeMounts:
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: zabbix-mcp-config
            items:
              - key: config.toml
                path: config.toml
        - name: nginx-templates
          configMap:
            name: zabbix-mcp-nginx-template
        - name: nginx-conf-d
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-mcp
  namespace: glazos
  labels:
    app: zabbix-mcp
spec:
  selector:
    app: zabbix-mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
