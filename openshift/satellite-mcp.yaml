# Red Hat Satellite MCP — foreman-mcp-server + nginx sidecar injecting FOREMAN auth headers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: satellite-mcp-nginx-template
  namespace: glazos
data:
  default.conf.template: |
    server {
      listen 8081;
      location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header FOREMAN_USERNAME "${FOREMAN_USERNAME}";
        proxy_set_header FOREMAN_TOKEN "${FOREMAN_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-mcp
  namespace: glazos
  labels:
    app: satellite-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satellite-mcp
  template:
    metadata:
      labels:
        app: satellite-mcp
    spec:
      securityContext:
        fsGroup: 1000850000
      containers:
        - name: foreman-mcp-server
          image: registry.redhat.io/satellite/foreman-mcp-server-rhel9:6.18
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - exec foreman-mcp-server --foreman-url "${SATELLITE_URL}"
          env:
            - name: SATELLITE_URL
              valueFrom:
                configMapKeyRef:
                  name: satellite-mcp-config
                  key: SATELLITE_URL
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: satellite-ca
              mountPath: /app/ca.pem
              subPath: ca.pem
              readOnly: true
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FOREMAN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: satellite-mcp-credentials
                  key: FOREMAN_USERNAME
            - name: FOREMAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: satellite-mcp-credentials
                  key: FOREMAN_TOKEN
          volumeMounts:
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: satellite-ca
          secret:
            secretName: satellite-mcp-credentials
            items:
              - key: ca.pem
                path: ca.pem
        - name: nginx-templates
          configMap:
            name: satellite-mcp-nginx-template
        - name: nginx-conf-d
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: satellite-mcp
  namespace: glazos
  labels:
    app: satellite-mcp
spec:
  selector:
    app: satellite-mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8081
      protocol: TCP
