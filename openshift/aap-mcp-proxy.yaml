# nginx proxy to external AAP MCP server — injects Bearer token from Secret aap-mcp-credentials.
# nginx template ConfigMap is applied from .env by deploy-openshift.sh.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-mcp-proxy
  namespace: glazos
  labels:
    app: aap-mcp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aap-mcp-proxy
  template:
    metadata:
      labels:
        app: aap-mcp-proxy
    spec:
      securityContext:
        fsGroup: 1000850000
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: AAP_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aap-mcp-credentials
                  key: AAP_MCP_TOKEN
          volumeMounts:
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-templates
          configMap:
            name: aap-mcp-proxy-nginx-template
        - name: nginx-conf-d
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aap-mcp-proxy
  namespace: glazos
  labels:
    app: aap-mcp-proxy
spec:
  selector:
    app: aap-mcp-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
